<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les secrets de mBot – Techno 3e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Fiche d'activité numérique : bandeaux de couleur par séance, cartes blanches sur fond bleuté, une colonne centrale de lecture */
  --navy:#1F4E79; --info:#2E75B6; --energie:#C55A11; --rfid:#3F7D20; --synth:#6B2FA0; --eval:#B3261E;
  --bg:#EEF3F8; --card:#FFFFFF; --ink:#1B2430; --muted:#566273; --line:#C9D4E0; --soft:#F5F8FB;
  --ok:#2E7D32; --ok-bg:#E3F3E4; --ko:#C62828; --ko-bg:#FDE7E7; --hl:#FFF4CC;
  --display:"Lexend", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
a{color:var(--info)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #F2A900;outline-offset:2px}
img{max-width:100%;height:auto}

/* barre du haut */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.top a{color:#fff;text-decoration:none;font-family:var(--display);font-weight:600}
.top .brand{margin-right:auto;display:flex;gap:10px;align-items:center}
.top .brand small{font-family:var(--body);font-weight:400;opacity:.8}
.top nav{display:flex;gap:6px;flex-wrap:wrap}
.top nav a{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-size:14px}
.top nav a.cur{background:#fff;color:var(--navy)}

.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:20px}

/* accueil */
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:32px 28px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
.hero .eyebrow{font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#FFD966}
.hero h1{font-size:40px;line-height:1.1;margin:6px 0 10px}
.hero p{margin:0 0 18px;color:#DCE6F2}
.hero img{border-radius:12px;border:3px solid rgba(255,255,255,.25)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid transparent;border-radius:10px;padding:9px 16px;font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;background:var(--info);color:#fff}
.btn.light{background:#fff;color:var(--navy)}
.btn.ghost{background:transparent;border-color:currentColor;color:inherit}
.btn.ok{background:var(--ok)}
.btn.warn{background:var(--eval)}
.btn:hover{filter:brightness(1.08)}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero h1{font-size:32px}}

.parcours{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.parcours div{background:var(--card);border-radius:12px;padding:12px 8px;text-align:center;border-top:5px solid var(--c)}
.parcours b{display:block;font-family:var(--display);font-size:22px;color:var(--c)}
.parcours span{font-size:14px;font-weight:700}
@media (max-width:720px){.parcours{grid-template-columns:repeat(4,1fr)}}

.sec-title{font-size:24px;color:var(--navy)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.scard{background:var(--card);border-radius:14px;padding:16px 18px;text-decoration:none;color:inherit;border-left:8px solid var(--c);display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 3px rgba(20,40,70,.08);transition:transform .15s}
.scard:hover{transform:translateY(-2px)}
.scard .num{font-family:var(--display);font-weight:700;color:var(--c);font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.scard h3{font-size:19px}
.scard p{margin:0;color:var(--muted);font-size:15px}
.scard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;font-size:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--soft);color:var(--muted)}
.pill.on{background:var(--ok-bg);color:var(--ok)}

/* fiche séance */
.head{background:var(--c);color:#fff;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.head .k{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.head h1{font-size:30px;line-height:1.15}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:rgba(255,255,255,.18);padding:3px 10px;border-radius:999px;font-size:14px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:14px;padding:18px 20px;box-shadow:0 1px 3px rgba(20,40,70,.08);display:flex;flex-direction:column;gap:12px}
.ident{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ident label{display:flex;flex-direction:column;font-size:14px;font-weight:700;color:var(--muted);gap:3px}
@media (max-width:640px){.ident{grid-template-columns:1fr 1fr}}
input[type=text],input[type=number],input[type=date],select,textarea{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;width:100%}
textarea{resize:vertical;min-height:64px}
select{cursor:pointer}
.travaille{border-left:6px solid var(--navy);background:var(--soft)}
.travaille h2{font-size:17px;color:var(--navy)}
.travaille ul{margin:0;padding-left:20px}
.prob{background:var(--hl);border-left:8px solid var(--eval)}
.prob .lab{font-family:var(--display);font-weight:700;color:var(--eval);font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.prob p{margin:0;font-weight:700;font-size:19px}
.situ{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:center}
.situ img{border-radius:10px}
@media (max-width:640px){.situ{grid-template-columns:1fr}}
.act{padding:0;overflow:hidden;gap:0}
.act > .bar{background:var(--ac);color:#fff;padding:10px 18px;display:flex;gap:12px;align-items:center}
.act > .bar .ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.act > .bar .ic svg{width:20px;height:20px;fill:#fff}
.act > .bar b{font-family:var(--display);letter-spacing:.04em}
.act > .inner{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.consigne{margin:0;font-weight:700}
.note{font-size:14px;color:var(--muted);margin:0}
.box{border-radius:10px;padding:10px 14px;font-size:15px}
.pouce{background:#F1F1F1;border-left:5px solid #888}
.pouce b{color:#555}
.loin{background:#F3EAF9;border-left:5px solid var(--synth)}
.loin b{color:var(--synth)}
.retiens{background:#E6F2DF;border-left:6px solid var(--rfid)}
.retiens h2{color:var(--rfid);font-size:20px}
.concl{background:#E7F0F9;border-left:5px solid var(--info)}
.radios{display:flex;gap:16px;flex-wrap:wrap}
.radios label{display:flex;gap:6px;align-items:center;cursor:pointer}

.fill{line-height:2.3;font-size:17px}
.fill select{width:auto;min-width:150px;display:inline-block;padding:2px 6px;border-width:2px;border-style:dashed}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{background:var(--ac,var(--info));color:#fff;text-align:left;padding:8px 10px;font-family:var(--display);font-weight:600;font-size:14px}
td{border:1px solid var(--line);padding:6px 8px;vertical-align:middle}
td.rh{font-weight:700;background:var(--soft)}
td img{display:block;margin:0 auto;max-height:70px}
td .cap{display:block;text-align:center;font-size:13px;color:var(--muted)}

.qcm{display:flex;flex-wrap:wrap;gap:8px}
.qcm label{display:flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;background:#fff}

/* chaînes */
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:10px;background:var(--soft)}
.bank .t{width:100%;font-size:13px;font-weight:700;color:var(--muted)}
.chip{border:2px solid var(--cc,var(--navy));color:var(--cc,var(--navy));background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;cursor:grab;user-select:none}
.chip.sel{background:var(--cc,var(--navy));color:#fff}
.chip.f{--cc:var(--chain)} .chip.c{--cc:#333} .chip.x{--cc:#777}
.chain{--chain:var(--info);border:3px solid var(--chain);border-radius:22px;padding:18px 14px 12px;position:relative;min-width:720px}
.chain .name{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);background:var(--chain);color:#fff;font-family:var(--display);font-weight:700;font-size:14px;padding:3px 16px;border-radius:999px;white-space:nowrap}
.crow{display:flex;align-items:center;gap:6px}
.crow.fl{padding-left:0;margin-bottom:4px}
.slot{min-height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;font-weight:700;padding:4px 6px;cursor:pointer;transition:background .15s}
.slot.empty{color:#9AA6B5;font-weight:400}
.slot.fn{flex:1;background:color-mix(in srgb,var(--chain) 14%,#fff);border:2px solid var(--chain);color:var(--chain)}
.slot.cp{flex:1;background:#fff;border:2px solid var(--chain);color:var(--ink);min-height:52px}
.slot.fx{flex:1;border:2px dashed #8C97A6;background:#fff;color:var(--ink);font-size:13px;min-height:40px}
.slot.io{width:100px;flex:none;border:2px dashed #8C97A6;background:#fff;color:var(--ink);font-size:13px}
.slot.fixed{cursor:default}
.slot.over{background:var(--hl)}
.arr{flex:none;color:#555;font-size:20px}
.cgrid{display:grid;gap:6px;align-items:center}
.vl{display:flex;justify-content:center}.vl i{width:2px;height:14px;background:var(--chain)}
.lbl{font-size:12px;color:var(--muted);text-align:center}

/* corrections */
.ok-m{background:var(--ok-bg)!important;border-color:var(--ok)!important}
.ko-m{background:var(--ko-bg)!important;border-color:var(--ko)!important}
.checkrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.score{font-weight:700}
.score.good{color:var(--ok)} .score.mid{color:#A66A00} .score.low{color:var(--ko)}

.auto table td{text-align:center}
.auto table td:first-child{text-align:left}
.lev th{text-align:center}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.pn{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.foot{text-align:center;color:var(--muted);font-size:14px}
.corr{border-left:6px solid var(--eval)}
.corr .ans{color:var(--eval);font-weight:700}
.hidden{display:none!important}

/* dialogue */
.dlg{position:fixed;inset:0;background:rgba(15,25,40,.55);display:grid;place-items:center;z-index:50;padding:16px}
.dlg .in{background:#fff;border-radius:14px;padding:20px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px}
.dlg textarea{min-height:260px;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:60}

@media print{
  .top,.toolbar,.checkrow,.pn,.bank,.noprint,.dlg{display:none!important}
  body{background:#fff;font-size:12pt}
  .card,.head{box-shadow:none;break-inside:avoid}
  .wrap{padding:0;max-width:none}
  .head,.act>.bar,th,.chain .name{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .chain{min-width:0}
}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’']/g,"'").replace(/\s+/g,' ').replace(/\./g,',').trim();

/* ---------- rendu des blocs ---------- */
function selHTML(key, opts, a, label){
  return `<select data-k="${key}" ${a!==undefined?`data-a="${esc(a)}"`:''} data-label="${esc(label)}" aria-label="${esc(label)}"><option value="">— choisir —</option>${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
}
function cellHTML(c, key, label){
  if (typeof c === 'string') return c;
  if (c.in) return `<input type="text" data-k="${key}" data-label="${esc(label)}" aria-label="${esc(label)}">`;
  if (c.sel) return selHTML(key, c.sel, c.a, label);
  if (c.img || c.cap) return (c.img?`<img src="${IMG[c.img]}" alt="${esc(c.cap||'')}">`:'') + `<span class="cap"><b>${esc(c.cap||'')}</b></span>`;
  return '';
}
function block(b, sid){
  const K = k => `${sid}.${k}`;
  switch(b.t){
    case 'html': return typeof b.html === 'function' ? b.html() : b.html;
    case 'p': return `<div>${b.html}</div>`;
    case 'situ': return `<section class="card situ"><div>${b.html}</div><img src="${IMG[b.img]}" alt="Station de vélos électriques en libre-service"></section>`;
    case 'prob': return `<section class="card prob"><div style="display:flex;gap:16px;align-items:center;justify-content:space-between"><div><div class="lab">Problématique</div><p>${b.text}</p></div>${b.img?`<img src="${IMG[b.img]}" alt="Logo RFID" style="width:70px">`:''}</div></section>`;
    case 'hyp': return `<section class="card" style="border-left:6px solid var(--energie)"><label for="${K(b.k)}"><b style="font-family:var(--display);color:var(--energie)">${b.label||'Mon hypothèse'}</b></label><textarea id="${K(b.k)}" data-k="${K(b.k)}" data-label="Mon hypothèse" rows="3" placeholder="Je pense que…"></textarea></section>`;
    case 'area': return `<label style="display:flex;flex-direction:column;gap:6px"><b>${b.label}</b><textarea data-k="${K(b.k)}" data-label="${esc(strip(b.label))}" rows="${b.rows||3}"></textarea></label>`;
    case 'line': return `<label style="display:flex;flex-direction:column;gap:4px"><b>${b.label}</b><input type="text" data-k="${K(b.k)}" ${b.a?`data-a="${esc(b.a)}" data-loose="1"`:''} data-label="${esc(strip(b.label))}" ${b.hint?`placeholder="${esc(b.hint)}"`:''}></label>`;
    case 'box': return `<div class="box ${b.cls}">${b.html}</div>`;
    case 'pouce': return `<div class="box pouce"><b>Coup de pouce :</b> <i>${b.text}</i></div>`;
    case 'loin': return `<section class="card loin"><b style="font-family:var(--display)">Pour aller plus loin</b><span>${b.text}</span><textarea data-k="${K(b.k)}" data-label="Pour aller plus loin" rows="2"></textarea></section>`;
    case 'retiens': return `<section class="card retiens"><h2>Je retiens</h2>${b.html}</section>`;
    case 'img': return `<figure style="margin:0;text-align:center"><img src="${IMG[b.src]}" alt="${esc(b.cap||'Schéma')}" style="${b.w?`max-width:${b.w}px`:''}">${b.cap?`<figcaption class="note">${b.cap}</figcaption>`:''}</figure>`;
    case 'concl': return `<section class="card concl"><b style="font-family:var(--display);color:var(--info)">Conclusion</b><div class="radios">Mon hypothèse est : <label><input type="radio" name="${K(b.k)}" value="validée" data-k="${K(b.k)}.v" data-label="Hypothèse"> validée</label><label><input type="radio" name="${K(b.k)}" value="à corriger" data-k="${K(b.k)}.c" data-label="Hypothèse"> à corriger</label></div><textarea data-k="${K(b.k)}.t" data-label="Conclusion" rows="2" placeholder="car…"></textarea></section>`;
    case 'fill': {
      let i = 0;
      const h = b.parts.map(p => typeof p === 'string' ? p : selHTML(K(b.k)+'.'+(i++), b.words, p.a, 'Mot manquant '+i)).join('');
      return `<div class="fill">${h}</div>`;
    }
    case 'table': {
      let prev = null;
      const rows = b.rows.map((r,ri) => '<tr>' + r.map((c,ci) => {
        if (c && c.sel === 'same') c = {...c, sel: prev};
        if (c && Array.isArray(c.sel)) prev = c.sel;
        const lab = `${strip(typeof r[0]==='string'?r[0]:(r[0].cap||'Ligne '+(ri+1)))} – ${b.head[ci]||''}`;
        const cls = (typeof c === 'string' && ci === 0) ? ' class="rh"' : '';
        return `<td${cls}${c==='→'?' style="text-align:center;border:none;font-size:20px"':''}>${cellHTML(c, `${K(b.k)}.${ri}.${ci}`, lab)}</td>`;
      }).join('') + '</tr>').join('');
      return `<div class="tw"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    case 'qcm': return `<div><b>${b.q}</b><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:6px"><div class="qcm">${b.opts.map((o,i)=>`<label><input type="checkbox" data-k="${K(b.k)}.${i}" data-qa="${b.a.includes(i)?1:0}" data-label="${esc(b.q)} – ${esc(o)}"> ${o}</label>`).join('')}</div>${b.img?`<img src="${IMG[b.img]}" alt="Tag RFID" style="width:90px">`:''}</div></div>`;
    case 'order': return `<div>${b.label?`<b>${b.label}</b>`:''}<div class="tw"><table><thead><tr><th style="width:110px">N°</th><th>Étape</th></tr></thead><tbody>${b.items.map((it,i)=>`<tr><td>${selHTML(`${K(b.k)}.${i}`, b.items.map((_,j)=>String(j+1)), String(b.a[i]), 'N° – '+it)}</td><td>${it}</td></tr>`).join('')}</tbody></table></div></div>`;
    case 'expe': {
      const k = K(b.k);
      return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px"><div class="tw"><table><thead><tr><th>Essai</th><th>Distance (cm)</th></tr></thead><tbody>${[1,2,3].map(i=>`<tr><td class="rh">${i}</td><td><input type="number" step="0.1" min="0" data-k="${k}.d${i}" data-label="Distance essai ${i} (cm)" class="dist"></td></tr>`).join('')}<tr><td class="rh">Moyenne</td><td><b id="moy">—</b> cm</td></tr></tbody></table></div><div class="tw"><table><thead><tr><th>Matériau</th><th>Lecture ?</th></tr></thead><tbody>${['Carton','Plastique','Bois','Aluminium'].map(m=>`<tr><td class="rh">${m}</td><td>${selHTML(`${k}.${m}`, ['oui','non'], undefined, 'Lecture à travers '+m)}</td></tr>`).join('')}</tbody></table></div></div>`;
    }
    case 'mchain': {
      const k = K(b.k); let bank = '', html = '';
      b.ch.forEach((name, ci) => {
        const d = MCH[name], n = d.f.length;
        if (d.bank) bank += d.bank.map(([t, arr]) => `<div class="t">${t}</div>` + arr.map(w => `<span class="chip" style="--cc:${d.color}" draggable="true" tabindex="0" role="button" data-w="${esc(w)}">${w}</span>`).join('')).join('');
        const sl = (v, cls, key, ph) => (typeof v === 'string') ? `<div class="slot ${cls} fixed">${v}</div>` : (v.t ? `<div class="slot ${cls} fixed">${v.t}</div>` : `<div class="slot ${cls} empty" tabindex="0" role="button" data-slot="${key}" data-k="${key}" data-a="${esc(v.a)}" data-label="${esc(ph)}" data-ph="${esc(v.ph||ph)}">${v.ph||ph}</div>`);
        const cols = ['104px','26px']; for (let i=0;i<n;i++){ cols.push('minmax(112px,1fr)'); cols.push('26px'); } cols.push('104px');
        const r1 = [sl(d.in,'io',`${k}.${name}.in`,'Entrée'), '<div class="arr">➜</div>'], r2 = ['<div></div>','<div></div>'], r3 = ['<div></div>','<div></div>'];
        for (let i=0;i<n;i++){ r1.push(sl(d.f[i],'fn',`${k}.${name}.f${i}`,'Fonction')); r1.push('<div class="arr">➜</div>'); r2.push('<div class="vl"><i></i></div>','<div></div>'); r3.push(sl(d.c[i],'cp',`${k}.${name}.c${i}`,'Constituant'),'<div></div>'); }
        r1.push(sl(d.out,'io',`${k}.${name}.out`,'Sortie')); r2.push('<div></div>'); r3.push('<div></div>');
        if (ci > 0) html += '<div style="text-align:center;margin:-6px 0 10px"><span class="pill on" style="background:#E3F3E4;color:var(--ok)">ORDRES ↓</span></div>';
        html += `<div class="tw" style="padding-bottom:20px"><div class="chain" style="--chain:${d.color};min-width:${n===4?900:740}px"><div class="cgrid" style="grid-template-columns:${cols.join(' ')};row-gap:6px">${[...r1,...r2,...r3].join('')}</div><span class="name">${d.name}</span></div></div>`;
      });
      return (bank ? `<div class="bank">${bank}</div>` : '') + html;
    }
    case 'chain': return chainHTML(b, K(b.k));
    case 'auto': {
      const items = ['décrire l’expérience utilisateur d’un objet','associer une fonction technique à sa solution technique','nommer les 3 fonctions de la chaîne d’information','nommer les 4 fonctions de la chaîne d’énergie','indiquer l’énergie en entrée et en sortie d’un constituant','relier les deux chaînes par l’ordre'];
      return `<section class="card auto" style="border-left:6px solid #BF8F00"><b style="font-family:var(--display);color:#8A6700">Je me positionne avant l’évaluation</b><div class="tw"><table><thead><tr><th style="background:#BF8F00">Je sais…</th><th style="background:#BF8F00;text-align:center">Oui</th><th style="background:#BF8F00;text-align:center">Pas encore</th></tr></thead><tbody>${items.map((it,i)=>`<tr><td>${it}</td><td><input type="radio" name="${K(b.k)}${i}" data-k="${K(b.k)}.${i}.o" data-label="Je sais ${esc(it)} – oui" aria-label="oui"></td><td><input type="radio" name="${K(b.k)}${i}" data-k="${K(b.k)}.${i}.n" data-label="Je sais ${esc(it)} – pas encore" aria-label="pas encore"></td></tr>`).join('')}</tbody></table></div></section>`;
    }
    case 'act': {
      const inner = b.blocks.map(x => block(x, sid)).join('');
      return `<section class="card act" style="--ac:${b.color||'var(--info)'}" data-check="${b.check?1:0}"><div class="bar"><span class="ic">${ICONS[b.icon]}</span><div><b>${b.label.toUpperCase()}</b> · ${b.title}</div></div><div class="inner">${inner}${b.check && !page.eval ? `<div class="checkrow"><button class="btn ok" data-do="check">Vérifier mes réponses</button><span class="score" aria-live="polite"></span></div>`:''}</div></section>`;
    }
  }
  return '';
}

/* chaînes à étiquettes */
const CHAINS = {
  info:{ color:'var(--info)', name:'CHAÎNE D’INFORMATION', n:3,
    f:['Acquérir','Traiter','Communiquer'], c:['Lecteur de badge','Carte électronique','Écran tactile'],
    fx:['Signal électrique','Signal électrique traité'], in:'Ondes électromagnétiques', out:'Informations visuelles', inLab:'Information d’entrée', outLab:'Information de sortie',
    bankF:['Acquérir','Traiter','Communiquer','Alimenter'], bankC:['Lecteur de badge','Carte électronique','Écran tactile','Électroaimant'], bankX:['Ondes électromagnétiques','Signal électrique','Signal électrique traité','Informations visuelles'], fixed:{f2:1} },
  energie:{ color:'var(--energie)', name:'CHAÎNE D’ÉNERGIE', n:4,
    f:['Alimenter','Distribuer','Convertir','Transmettre'], c:['Transformateur','Relais','Électroaimant','Doigt métallique'],
    fx:['Énergie électrique adaptée','Énergie électrique distribuée','Énergie mécanique'], in:'Énergie électrique du réseau', out:'Verrouiller / déverrouiller le vélo', inLab:'Énergie d’entrée', outLab:'Action réalisée',
    bankF:['Alimenter','Distribuer','Convertir','Transmettre','Acquérir'], bankC:['Transformateur','Relais','Électroaimant','Doigt métallique','Carte électronique'], bankX:['Énergie électrique du réseau','Énergie électrique adaptée','Énergie électrique distribuée','Énergie mécanique','Verrouiller / déverrouiller le vélo'] }
};
function chainHTML(b, k){
  const d = CHAINS[b.kind], n = d.n;
  const ph2 = b.kind==='info' ? 'Nature de l’information' : 'Forme d’énergie';
  const slot = (cls, key, a, ph, fixed) => fixed
    ? `<div class="slot ${cls} fixed">${a}</div>`
    : `<div class="slot ${cls} empty" tabindex="0" role="button" data-slot="${key}" data-k="${key}" data-a="${esc(a)}" data-label="${esc(ph)}" data-ph="${esc(ph)}">${ph}</div>`;
  const cols = ['100px','26px'];
  for (let i=0;i<n;i++){ cols.push('minmax(104px,1fr)'); if (i<n-1) cols.push('116px'); }
  cols.push('26px','100px');
  const r1=[], r2=[], r3=[], r4=[];
  r1.push('<div class="lbl">'+d.inLab+'</div>','<div></div>');
  r2.push(slot('io', k+'.in', d.in, ph2), '<div class="arr">➜</div>');
  r3.push('<div></div>','<div></div>'); r4.push('<div></div>','<div></div>');
  for (let i=0;i<n;i++){
    r1.push('<div class="lbl">Bloc '+(i+1)+'</div>');
    r2.push(slot('fn', `${k}.f${i}`, d.f[i], 'Fonction', d.fixed && d.fixed['f'+i]));
    r3.push('<div class="vl"><i></i></div>');
    r4.push(slot('cp', `${k}.c${i}`, d.c[i], 'Composant'));
    if (i<n-1){
      r1.push('<div></div>');
      r2.push(`<div style="display:flex;flex-direction:column;align-items:center;gap:2px">${slot('fx', `${k}.x${i}`, d.fx[i], ph2)}<span class="arr">➜</span></div>`);
      r3.push('<div></div>'); r4.push('<div></div>');
    }
  }
  r1.push('<div></div>','<div class="lbl">'+d.outLab+'</div>');
  r2.push('<div class="arr">➜</div>', slot('io', k+'.out', d.out, b.kind==='info'?ph2:'Action'));
  r3.push('<div></div>','<div></div>'); r4.push('<div></div>','<div></div>');
  const grid = `<div class="cgrid" style="grid-template-columns:${cols.join(' ')};row-gap:6px">${[...r1,...r2,...r3,...r4].join('')}</div>`;
  const bank = (t, arr, cls) => `<div class="t">${t}</div>` + arr.map(w=>`<span class="chip ${cls}" draggable="true" tabindex="0" role="button" data-w="${esc(w)}">${w}</span>`).join('');
  return `<div class="bank" style="--chain:${d.color}">${bank('Fonctions', d.bankF, 'f')}${bank('Composants', d.bankC, 'c')}${bank(b.kind==='info'?'Nature de l’information':'Formes d’énergie et action', d.bankX, 'x')}</div>
  <div class="tw" style="padding-bottom:20px"><div class="chain" style="--chain:${d.color};min-width:${n===4?990:780}px">${grid}<span class="name">${d.name}</span></div></div>`;
}

  app.innerHTML = `
  <section class="hero">
    <div><div class="eyebrow">Technologie · Cycle 4 · 3e · Séquence 2</div><h1>Les secrets de mBot</h1>
    <p>Comment mBot transforme-t-il une information (distance, lumière…) en mouvement, et avec quels matériaux est-il fabriqué ? En 7 séances d’1 heure, tu analyses ses chaînes, tu le programmes et tu étudies son impact sur l’environnement.</p>
    <div class="btns"><a class="btn light" href="#seances">Découvrir les séances ↓</a><a class="btn ghost" href="#retiens">Je retiens</a><a class="btn ghost" href="#depot">Rendre mon travail</a></div></div>
    <img src="${IMG.robot}" alt="Le robot mBot face à un obstacle">
  </section>
  <section class="card"><h2 class="sec-title">Mon parcours dans la séquence</h2><div class="parcours">${steps.map((s,i)=>`<div style="--c:${s[1]}"><b>${i+1}</b><span>${s[0]}</span></div>`).join('')}</div></section>
  <h2 class="sec-title" id="seances">Les séances</h2>
  <div class="cards">${SEANCES.map(s=>`<a class="scard" href="#${s.id}" style="--c:${C[s.id]}"><span class="num">Séance ${s.n}</span><h3>${s.titre}</h3><p>${s.resume}</p><span class="meta"><span>⏱ 60 min</span><span class="pill ${started(s.id)?'on':''}">${started(s.id)?'Commencée':'À faire'}</span></span></a>`).join('')}</div>
  <section class="card" id="depot"><h2 class="sec-title">Rendre mon travail</h2>
    <p style="margin:0">Tes réponses restent sur cet ordinateur. Pour les rendre, deux possibilités en bas de chaque séance :</p>
    <ul style="margin:0"><li><b>Générer le PDF</b> : enregistre ta fiche en PDF, puis dépose-la sur l’ENT.</li><li><b>Copier mes réponses</b> : copie un texte que tu colles dans le devoir de l’ENT.</li></ul>
    <p class="note">Sur un ordinateur partagé, clique sur « Effacer mes réponses » quand tu as terminé.</p></section>
  <p class="foot"><a href="../index.html">← Retour à tous les niveaux</a><br>Technologie 3e · Séquence 2 « Les secrets de mBot » · Programme cycle 4 (BO n°9 du 29 février 2024)</p>`;
  window.scrollTo(0,0);
}

function renderRetiens(){
  page = null; renderNav('retiens');
  const R = (t, col, html) => `<section class="card retiens" style="border-color:${col}"><h2 style="color:${col}">${t}</h2>${html}</section>`;
  const fig = (k, cap) => `<figure style="margin:0;text-align:center"><img src="${IMG[k]}" alt="${cap}" style="max-height:150px"><figcaption class="note">${cap}</figcaption></figure>`;
  app.innerHTML = `<section class="head" style="--c:var(--rfid)"><span class="k">Traces écrites</span><h1>Je retiens – Les secrets de mBot</h1></section>
  ${R('N°1 – Chaîne d’information et mécanismes','var(--info)',`<p>La <b>chaîne d’information</b> : <b>ACQUÉRIR</b> (capteurs : ultrasons, suiveur de ligne, lumière, bouton), <b>TRAITER</b> (microcontrôleur de la carte mCore), <b>COMMUNIQUER</b> (câbles, DEL, buzzer, ordres aux moteurs).</p><p>Les <b>mécanismes de transmission</b> assurent la fonction <b>Transmettre</b> : ils transmettent un mouvement sans changer sa nature ; un mécanisme de <b>transformation</b> change sa nature (pignon-crémaillère : rotation → translation). Un petit engrenage qui entraîne un grand donne <b>moins de vitesse et plus de force</b>.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">${fig('engrenages','Engrenages')}${fig('courroie','Poulies et courroie')}${fig('chaine_velo','Pignons et chaîne')}${fig('cremaillere','Pignon et crémaillère')}</div>`)}
  ${R('N°2 – Chaîne d’énergie et conversions','var(--energie)',`<p><b>ALIMENTER</b> (piles, batterie) → <b>DISTRIBUER</b> (câbles, relais) → <b>CONVERTIR</b> (moteur) → <b>TRANSMETTRE</b> (engrenages). L’énergie ne se crée pas : elle se convertit, avec des <b>pertes</b> (souvent de la chaleur).</p><div class="tw"><table style="--ac:var(--energie)"><thead><tr><th>Constituant</th><th>Énergie reçue</th><th>Énergie utile</th><th>Perte</th></tr></thead><tbody><tr><td class="rh">Moteur</td><td>électrique</td><td>cinétique</td><td>thermique</td></tr><tr><td class="rh">Lampe</td><td>électrique</td><td>lumineuse</td><td>thermique</td></tr><tr><td class="rh">Radiateur</td><td>électrique</td><td>thermique</td><td>—</td></tr><tr><td class="rh">Génératrice</td><td>mécanique</td><td>électrique</td><td>thermique</td></tr><tr><td class="rh">Vérin</td><td>hydraulique ou pneumatique</td><td>mécanique</td><td>thermique</td></tr></tbody></table></div>`)}
  ${R('N°3 – Programmation, signaux, batterie et relais','var(--navy)',`<p>Un <b>algorithme</b> décrit les étapes (Si… Alors… Sinon…, Répéter…) ; le <b>programme</b> mBlock le traduit en blocs. Un signal <b>analogique</b> prend une infinité de valeurs ; un signal <b>numérique (logique)</b> ne prend que 0 ou 1.</p><p>La <b>batterie</b> stocke et fournit l’énergie électrique. Le <b>relais</b> est un interrupteur commandé par un courant : il distribue le courant à l’actionneur selon les ordres.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">${fig('batterie','Batterie')}${fig('relais','Module relais')}${fig('interrupteurs','Interrupteurs')}</div><img src="${IMG.chaines}" alt="Les deux chaînes de mBot reliées par les ordres">`)}
  ${R('N°4 – Matériaux et environnement','var(--rfid)','<p>Chaque pièce a des besoins différents : un objet est fait de <b>plusieurs matériaux</b>. On les choisit selon des critères <b>techniques</b>, <b>économiques</b> et <b>environnementaux</b>. L’incidence environnementale s’étudie sur le <b>cycle de vie</b> : extraction → fabrication → transport → utilisation → fin de vie. Les appareils électroniques et les piles se déposent en <b>point de collecte</b>.</p>')}
  <div class="pn"><a class="btn light" href="#accueil">← Sommaire</a></div>`;
  window.scrollTo(0,0);
}

function renderSeance(s){
  page = s; renderNav(s.id); data = store.get(s.id);
  const prev = SEANCES[s.n-2], next = SEANCES[s.n];
  app.innerHTML = `
  <section class="head" style="--c:${C[s.id]}"><span class="k">Séance ${s.n} · 60 min${s.eval?' · évaluation individuelle':''}</span><h1>${s.titre}</h1><div class="chips">${s.chips.map(c=>`<span>${c}</span>`).join('')}</div></section>
  <section class="card"><div class="ident">${[['nom','Nom','text'],['prenom','Prénom','text'],['classe','Classe','text'],['groupe','Groupe / îlot','text'],['role','Rôle dans l’îlot','sel'],['date','Date','date']].map(([k,l,t])=>`<label>${l}${t==='sel'?`<select data-id="${k}"><option value="">—</option><option>Lecteur</option><option>Secrétaire</option><option>Porte-parole</option><option>Gardien du temps</option></select>`:`<input type="${t}" data-id="${k}">`}</label>`).join('')}</div></section>
  <section class="card travaille"><h2>Ce que je travaille</h2><ul>${s.comps.map(c=>`<li>${c}</li>`).join('')}</ul><p class="note">Niveaux de maîtrise : MI insuffisante · MF fragile · MS satisfaisante · TBM très bonne.</p></section>
  ${s.blocks.map(b => block(b, s.id)).join('')}
  <section class="card toolbar noprint">
    <div class="btns"><button class="btn" data-do="pdf">Générer le PDF</button><button class="btn light" style="border-color:var(--line)" data-do="copy">Copier mes réponses</button></div>
    <div class="btns"><button class="btn light" style="border-color:var(--line)" data-do="corr">Correction (professeur)</button><button class="btn warn" data-do="clear">Effacer mes réponses</button></div>
  </section>
  <section class="card corr hidden" id="corr"><b style="font-family:var(--display);color:var(--eval)">Correction</b>${s.corr}<p class="note">Les questions à choix sont aussi vérifiables avec les boutons « Vérifier mes réponses ».</p></section>
  <p class="foot">Tes réponses restent sur cet appareil.</p>
  <div class="pn">${prev?`<a class="btn light" href="#${prev.id}">← Séance ${prev.n}</a>`:'<a class="btn light" href="#accueil">← Accueil</a>'}${next?`<a class="btn" href="#${next.id}">Séance ${next.n} →</a>`:'<a class="btn" href="#retiens">Je retiens →</a>'}</div>`;
  restore(); window.scrollTo(0,0);
}

/* ---------- état ---------- */
function restore(){
  app.querySelectorAll('[data-id]').forEach(el => { el.value = identity[el.dataset.id] || ''; });
  app.querySelectorAll('[data-k]').forEach(el => {
    const v = data[el.dataset.k]; if (v === undefined) return;
    if (el.dataset.slot !== undefined) setSlot(el, v);
    else if (el.type === 'checkbox' || el.type === 'radio') el.checked = !!v;
    else el.value = v;
  });
  updateMoy();
}
function save(){ if (page) store.set(page.id, data); }
function setSlot(el, v){
  el.dataset.v = v || '';
  el.textContent = v || el.dataset.ph;
  el.classList.toggle('empty', !v);
  el.classList.remove('ok-m','ko-m');
  data[el.dataset.k] = v || '';
}
function updateMoy(){
  const m = document.getElementById('moy'); if (!m) return;
  const v = [...app.querySelectorAll('.dist')].map(i=>parseFloat(i.value)).filter(x=>!isNaN(x));
  m.textContent = v.length ? (v.reduce((a,b)=>a+b,0)/v.length).toFixed(1).replace('.',',') : '—';
}

app.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.id){ identity[el.dataset.id] = el.value; store.set('id', identity); return; }
  if (!el.dataset.k) return;
  if (el.type === 'radio'){ app.querySelectorAll(`input[name="${el.name}"]`).forEach(r => { data[r.dataset.k] = r.checked; }); }
  else data[el.dataset.k] = (el.type === 'checkbox') ? el.checked : el.value;
  el.classList.remove('ok-m','ko-m'); el.closest('label')?.classList.remove('ok-m','ko-m');
  updateMoy(); save();
});
app.addEventListener('change', e => {
  const el = e.target; if (el.type === 'radio'){ app.querySelectorAll(`input[name="${el.name}"]`).forEach(r => { data[r.dataset.k] = r.checked; }); save(); }
  if (el.type === 'checkbox' && el.dataset.k){ data[el.dataset.k] = el.checked; save(); }
});

/* étiquettes : clic ou glisser */
app.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip){ app.querySelectorAll('.chip.sel').forEach(c=>c.classList.remove('sel')); if (selChip === chip.dataset.w){ selChip = null; } else { chip.classList.add('sel'); selChip = chip.dataset.w; } return; }
  const slot = e.target.closest('[data-slot]');
  if (slot){ if (selChip){ setSlot(slot, selChip); } else { setSlot(slot, ''); } save(); return; }
  const b = e.target.closest('[data-do]'); if (b) action(b.dataset.do, b);
});
app.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && (e.target.matches('.chip,[data-slot]'))){ e.preventDefault(); e.target.click(); } });
app.addEventListener('dragstart', e => { const c = e.target.closest('.chip'); if (c) e.dataTransfer.setData('text/plain', c.dataset.w); });
app.addEventListener('dragover', e => { const s = e.target.closest('[data-slot]'); if (s){ e.preventDefault(); s.classList.add('over'); } });
app.addEventListener('dragleave', e => { const s = e.target.closest('[data-slot]'); if (s) s.classList.remove('over'); });
app.addEventListener('drop', e => { const s = e.target.closest('[data-slot]'); if (s){ e.preventDefault(); s.classList.remove('over'); setSlot(s, e.dataTransfer.getData('text/plain')); save(); } });

/* ---------- actions ---------- */
function check(section){
  let ok = 0, tot = 0;
  section.querySelectorAll('[data-a]').forEach(el => {
    const val = el.dataset.slot !== undefined ? el.dataset.v : el.value;
    const good = el.dataset.loose ? norm(val).includes(norm(el.dataset.a)) : norm(val) === norm(el.dataset.a);
    tot++; if (good) ok++;
    el.classList.toggle('ok-m', good); el.classList.toggle('ko-m', !good);
  });
  const q = {};
  section.querySelectorAll('[data-qa]').forEach(el => { const g = el.dataset.k.split('.').slice(0,-1).join('.'); (q[g] = q[g] || []).push(el); });
  Object.values(q).forEach(list => { tot++; const good = list.every(el => el.checked === (el.dataset.qa === '1')); if (good) ok++; list.forEach(el => { const l = el.closest('label'); l.classList.toggle('ok-m', good && el.checked); l.classList.toggle('ko-m', !good && el.checked !== (el.dataset.qa === '1')); }); });
  const sc = section.querySelector('.score'); const r = tot ? ok/tot : 0;
  sc.className = 'score ' + (r === 1 ? 'good' : r >= .5 ? 'mid' : 'low');
  sc.textContent = r === 1 ? `Bravo ! ${ok} / ${tot} réponses justes.` : `${ok} / ${tot} réponses justes. Corrige les cases en rouge et vérifie à nouveau.`;
}
function summary(){
  const id = identity, s = page;
  const lines = [`Technologie 4e – Séance ${s.n} : ${s.titre}`, `${id.nom||''} ${id.prenom||''} – ${id.classe||''} – îlot ${id.groupe||''} (${id.role||''}) – ${id.date||''}`, ''];
  app.querySelectorAll('section.card').forEach(sec => {
    const t = sec.querySelector('.bar div')?.textContent; let first = true;
    sec.querySelectorAll('[data-k]').forEach(el => {
      let v;
      if (el.dataset.slot !== undefined) v = el.dataset.v; else if (el.type === 'checkbox' || el.type === 'radio') v = el.checked ? '✔' : ''; else v = el.value;
      if (!v) return;
      if (first && t){ lines.push('== ' + t); first = false; }
      lines.push(`- ${el.dataset.label || ''} : ${v}`);
    });
  });
  return lines.join('\n');
}
function dialog(html){ const d = document.getElementById('dlg'); d.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><div class="in">${html}</div></div>`; d.querySelector('.dlg').addEventListener('click', e => { if (e.target.classList.contains('dlg') || e.target.dataset.close !== undefined) d.innerHTML=''; }); return d; }
function toast(t){ const x = document.createElement('div'); x.className='toast'; x.textContent=t; document.body.appendChild(x); setTimeout(()=>x.remove(), 2600); }
function action(a, btn){
  if (a === 'check') return check(btn.closest('section.act'));
  if (a === 'pdf'){
    try { window.print(); } catch(e) {}
    setTimeout(()=>toast('Si rien ne s’ouvre, utilise « Copier mes réponses » ou Ctrl + P.'), 600);
    return;
  }
  if (a === 'copy'){
    const txt = summary();
    const d = dialog(`<h2 style="font-size:20px">Mes réponses</h2><p class="note" style="margin:0">Copie ce texte et colle-le dans ton devoir sur l’ENT ou Classroom.</p><textarea readonly>${esc(txt)}</textarea><div class="btns"><button class="btn" id="cp">Copier</button><button class="btn light" style="border-color:var(--line)" data-close>Fermer</button></div>`);
    d.querySelector('#cp').onclick = async () => { const ta = d.querySelector('textarea'); try { await navigator.clipboard.writeText(ta.value); toast('Réponses copiées.'); } catch(e){ ta.select(); toast('Sélectionne le texte puis Ctrl + C.'); } };
    return;
  }
  if (a === 'corr'){
    const d = dialog(`<h2 style="font-size:20px">Correction</h2><label for="pw">Mot de passe du professeur</label><input type="password" id="pw" autocomplete="off"><p class="note hidden" id="pwerr" style="color:var(--ko)">Mot de passe incorrect.</p><div class="btns"><button class="btn" id="pwok">Afficher</button><button class="btn light" style="border-color:var(--line)" data-close>Annuler</button></div>`);
    const go = () => { if (d.querySelector('#pw').value === MOT_DE_PASSE_PROF){ d.innerHTML=''; const c = document.getElementById('corr'); c.classList.remove('hidden'); c.scrollIntoView(); } else d.querySelector('#pwerr').classList.remove('hidden'); };
    d.querySelector('#pwok').onclick = go; d.querySelector('#pw').addEventListener('keydown', e => { if (e.key==='Enter') go(); }); d.querySelector('#pw').focus();
    return;
  }
  if (a === 'clear'){
    const d = dialog(`<h2 style="font-size:20px">Effacer mes réponses ?</h2><p style="margin:0">Toutes les réponses de cette séance seront supprimées de cet ordinateur.</p><div class="btns"><button class="btn warn" id="yes">Effacer</button><button class="btn light" style="border-color:var(--line)" data-close>Annuler</button></div>`);
    d.querySelector('#yes').onclick = () => { store.del(page.id); d.innerHTML=''; renderSeance(page); toast('Réponses effacées.'); };
  }
}

/* ---------- routage ---------- */
function route(){
  const h = (location.hash || '').slice(1);
  const s = SEANCES.find(x => x.id === h);
  if (s) renderSeance(s); else if (h === 'retiens') renderRetiens();
  else { renderHome(); if (h === 'seances' || h === 'depot') document.getElementById(h)?.scrollIntoView(); }
}
window.addEventListener('hashchange', route);
route();
</script>
