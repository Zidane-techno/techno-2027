<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technologie & SNT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Portail : un bandeau marine, puis une bande par niveau, chaque niveau garde sa couleur */
  --navy:#1F4E79; --bg:#EEF3F8; --card:#FFFFFF; --ink:#1B2430; --muted:#566273; --line:#C9D4E0; --soft:#F5F8FB;
  --display:"Lexend","Segoe UI",system-ui,sans-serif; --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
a{color:inherit}
:focus-visible{outline:3px solid #F2A900;outline-offset:2px}
.top{background:var(--navy);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.top b{font-family:var(--display);margin-right:auto}
.top nav{display:flex;gap:6px;flex-wrap:wrap}
.top nav a{text-decoration:none;font-family:var(--display);font-weight:600;font-size:14px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.14)}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:24px}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:30px 28px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#FFD966}
.hero h1{font-size:40px;line-height:1.1}
.hero p{margin:0;color:#DCE6F2;max-width:60ch}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.lvl{background:#fff;color:var(--ink);text-decoration:none;border-radius:14px;padding:14px 16px;border-top:6px solid var(--c);display:flex;flex-direction:column;gap:2px;transition:transform .15s}
.lvl:hover{transform:translateY(-2px)}
.lvl b{font-family:var(--display);font-size:26px;color:var(--c)}
.lvl span{font-size:14px;color:var(--muted)}
@media (max-width:720px){.levels{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:30px}}
.level{display:flex;flex-direction:column;gap:12px;scroll-margin-top:64px}
.level-head{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--c);padding-bottom:6px}
.level-head .badge{background:var(--c);color:#fff;font-family:var(--display);font-weight:700;border-radius:10px;padding:4px 12px;font-size:20px}
.level-head h2{font-size:22px;color:var(--ink)}
.level-head small{margin-left:auto;color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.seq{background:var(--card);border-radius:14px;padding:16px 18px;border-left:8px solid var(--c);text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 3px rgba(20,40,70,.08);transition:transform .15s}
a.seq:hover{transform:translateY(-2px)}
.seq .theme{font-family:var(--display);font-size:13px;font-weight:600;color:var(--c);text-transform:uppercase;letter-spacing:.04em}
.seq h3{font-size:19px}
.seq p{margin:0;color:var(--muted);font-size:15px}
.seq .meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;font-size:14px}
.seq .go{font-family:var(--display);font-weight:600;color:var(--c)}
.seq.soon{opacity:.6;border-left-style:dashed}
.pill{padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:700;font-size:13px}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);text-align:center}
.foot{text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header class="top"><b id="topTitle">Technologie & SNT</b><nav id="nav" aria-label="Niveaux"></nav></header>
<main class="wrap" id="app"></main>
<script src="catalogue.js"></script>
<script>
(function(){
  const app = document.getElementById('app');
  if (typeof NIVEAUX === 'undefined' || typeof SITE === 'undefined'){
    app.innerHTML = '<div class="empty"><b>Le fichier catalogue.js contient une erreur ou est absent.</b><br>Vérifie les guillemets droits " et les virgules après chaque bloc }.</div>';
    return;
  }
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.title = SITE.titre;
  document.getElementById('topTitle').textContent = SITE.titre + (SITE.etablissement ? ' · ' + SITE.etablissement : '');
  document.getElementById('nav').innerHTML = NIVEAUX.map(n => `<a href="#niveau-${esc(n.id)}">${esc(n.nom)}</a>`).join('');
  const total = n => n.sequences.filter(s => s.statut !== 'bientot').length;
  const card = (s, n) => {
    const soon = s.statut === 'bientot' || !s.lien;
    const ext = /^https?:/.test(s.lien || '');
    const inner = `<span class="theme">${esc(s.theme)}</span><h3>${esc(s.titre)}</h3><p>${esc(s.description)}</p>
      <span class="meta"><span>${s.seances ? '⏱ ' + esc(s.seances) + ' séances' : ''}</span>${soon ? '<span class="pill">Bientôt</span>' : `<span class="go">Commencer →</span>`}</span>`;
    return soon ? `<div class="seq soon" style="--c:${esc(n.couleur)}">${inner}</div>`
                : `<a class="seq" style="--c:${esc(n.couleur)}" href="${esc(s.lien)}"${ext ? ' target="_blank" rel="noopener"' : ''}>${inner}</a>`;
  };
  app.innerHTML = `
    <section class="hero">
      <span class="eyebrow">${esc(SITE.etablissement || 'Collège · Lycée')}</span>
      <h1>${esc(SITE.titre)}</h1>
      <p>${esc(SITE.sousTitre)}</p>
      <div class="levels">${NIVEAUX.map(n => `<a class="lvl" href="#niveau-${esc(n.id)}" style="--c:${esc(n.couleur)}"><b>${esc(n.nom)}</b><span>${esc(n.discipline)} · ${total(n)} séquence${total(n) > 1 ? 's' : ''}</span></a>`).join('')}</div>
    </section>
    ${NIVEAUX.map(n => `
    <section class="level" id="niveau-${esc(n.id)}" style="--c:${esc(n.couleur)}">
      <div class="level-head"><span class="badge">${esc(n.nom)}</span><h2>${esc(n.discipline)}</h2><small>${total(n)} séquence${total(n) > 1 ? 's' : ''} disponible${total(n) > 1 ? 's' : ''}</small></div>
      ${n.sequences.length ? `<div class="cards">${n.sequences.map(s => card(s, n)).join('')}</div>` : `<div class="empty">Les séquences de ${esc(n.nom)} arrivent bientôt.</div>`}
    </section>`).join('')}
    <p class="foot">${SITE.professeur ? esc(SITE.professeur) + ' · ' : ''}Tes réponses restent sur l’ordinateur que tu utilises.</p>`;
  const h = location.hash.slice(1); if (h) document.getElementById(h)?.scrollIntoView();
})();
</script>
</body>
</html>
